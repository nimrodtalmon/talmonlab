}

/* the look of a phone: themes, shape, density */
.phone { --p-bg:#f8f8f6; --p-card:#fff; --p-ink:#1c1f23; --p-mute:#6c7177; --p-line:#e5e5e1; --p-acc:#14806f; --p-acc2:#e6f3f0; --p-me:#dcf3ec; --p-r:14px; --p-pill:99px; --p-font:inherit; --p-pad:9px; }

  return v.phrase.split(/\b/).map(w => w in val ? `<b>${esc(val[w] === me ? 'you' : show(val[w]))}</b>` : esc(w)).join('')
    .replace(/^<b>you<\/b> has /, '<b>you</b> have ').replace(/^<b>you<\/b> is /, '<b>you</b> are ').replace(/^<b>you<\/b> counts /, '<b>you</b> count ').replace(/^<b>you<\/b> knows /, '<b>you</b> know ').replace(/^<b>you<\/b> (holds|sees|sends|keeps) /, (m, v) => '<b>you</b> ' + v.slice(0, -1) + ' ');

const view = p => W.view(p);

/* coins: atoms that differ only in a coin are one item, with how many there are */
const isCoin = x => x && typeof x === 'object' && 'coin' in x;

    const its = items(c2, v.atoms, p), key = x => JSON.stringify(x), had = u.known[c2.title];

  const now = Date.now(); v.notes.forEach(n => { n.at = n.at || now; });
